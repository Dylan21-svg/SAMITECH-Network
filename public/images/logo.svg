<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380">
  <defs>
    <!-- Blue Gradient for S, Wi-Fi arcs and Top-Left Ring -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="40%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>

    <!-- Red Gradient for T and Bottom-Right Ring -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#C80000" />
    </linearGradient>

    <!-- Wi-Fi Waves Gradient -->
    <linearGradient id="wifiGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077FE" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Left Emblem Group (center ~190, 190) -->
  <g transform="translate(10, 0)">
    <!-- Wi-Fi Signal Waves (Top Right of Emblem) -->
    <!-- Wave 1 (Inner) -->
    <path d="M 270 148 A 32 32 0 0 1 306 112" fill="none" stroke="url(#wifiGrad)" stroke-width="16" stroke-linecap="round" />
    <!-- Wave 2 (Middle) -->
    <path d="M 268 114 A 68 68 0 0 1 338 44" fill="none" stroke="url(#wifiGrad)" stroke-width="17" stroke-linecap="round" />
    <!-- Wave 3 (Outer) -->
    <path d="M 266 80 A 104 104 0 0 1 370 -24" fill="none" stroke="url(#wifiGrad)" stroke-width="18" stroke-linecap="round" transform="translate(0, 32)" />

    <!-- Outer Circular Ring -->
    <!-- Top-Left Blue Half Ring -->
    <path d="M 248 84 A 148 148 0 0 0 52 248 L 84 242 A 116 116 0 0 1 248 114 Z" fill="url(#blueGrad)" />
    
    <!-- Bottom-Right Red Half Ring -->
    <path d="M 62 258 A 148 148 0 0 0 312 215 L 282 205 A 116 116 0 0 1 88 275 Z" fill="url(#redGrad)" />

    <!-- Stylized "S" in Blue -->
    <!-- Upper loop of S -->
    <path d="M 80 190 C 80 145 110 130 165 130 L 250 130 L 250 158 L 165 158 C 125 158 112 168 112 190 C 112 212 130 220 180 226 L 210 230 C 265 238 278 260 278 290 C 278 325 245 342 190 342 L 50 342 L 80 312 L 190 312 C 230 312 244 302 244 286 C 244 268 230 260 185 254 L 155 250 C 105 242 80 222 80 190 Z" fill="url(#blueGrad)" />

    <!-- Stylized "T" in Vivid Red -->
    <!-- Horizontal Top Bar of T (aerodynamic cut) -->
    <path d="M 82 170 L 102 124 L 264 124 L 250 170 Z" fill="url(#redGrad)" filter="url(#subtleShadow)" />
    <!-- Vertical Stem of T -->
    <path d="M 166 170 L 206 170 L 206 308 L 166 308 Z" fill="url(#redGrad)" filter="url(#subtleShadow)" />
  </g>

  <!-- Right Typography Group -->
  <!-- "SAMITECH" in bold white/silver uppercase -->
  <text x="360" y="185" font-family="Montserrat, system-ui, -apple-system, sans-serif" font-size="124" font-weight="900" fill="#FFFFFF" letter-spacing="4" filter="url(#subtleShadow)">SAMITECH</text>

  <!-- "NETWORKS" Row with Green Accent Rules -->
  <!-- Left Green Line -->
  <rect x="365" y="240" width="75" height="10" rx="5" fill="#00C800" />
  <!-- Text NETWORKS -->
  <text x="460" y="254" font-family="Montserrat, system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#00C800" letter-spacing="12">NETWORKS</text>
  <!-- Right Green Line -->
  <rect x="905" y="240" width="75" height="10" rx="5" fill="#00C800" />

  <!-- "CONNECTING THE FUTURE" Row with Green Arrows -->
  <!-- Left Arrow -->
  <g transform="translate(365, 305)">
    <path d="M 25 0 L 0 0 M 10 -8 L 0 0 L 10 8" fill="none" stroke="#00C800" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <!-- Text CONNECTING THE FUTURE -->
  <text x="435" y="310" font-family="Montserrat, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#E5E7EB" letter-spacing="8">CONNECTING THE FUTURE</text>
  <!-- Right Arrow -->
  <g transform="translate(920, 305)">
    <path d="M 0 0 L 25 0 M 15 -8 L 25 0 L 15 8" fill="none" stroke="#00C800" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
